name: student-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked assignment environment
        run: uv sync --locked --python 3.12

      - name: Validate assignment contract and protected files
        run: uv run --locked python scripts/validate_submission.py

      - name: Validate final submission evidence for learner-authored change
        if: (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.event.repository.name) || (github.event_name == 'push' && github.actor == github.event.repository.name)
        run: uv run --locked python scripts/validate_submission.py --final

      - name: Scan assignment for credentials
        run: uv run --locked python scripts/security_scan.py

      - name: Lint student code and assignment checks
        run: uv run --locked ruff check src tests scripts

      - name: Run public tests
        run: PYTHONPATH=src uv run --locked python -m unittest discover -s tests -v

      - name: Run project evaluation entry when provided
        shell: bash
        run: |
          if [ -f eval/evaluate.py ]; then
            PYTHONPATH=src uv run --locked python eval/evaluate.py
          fi

      - name: Run selected A03 paper-pack tests when provided
        shell: bash
        run: |
          if [ -d paper_pack ]; then
            PYTHONPATH="src:paper_pack" uv run --locked python -m unittest discover -s paper_pack -p "test_*.py" -v
          fi

      - name: Execute student notebook without modifying the checkout
        run: uv run --locked python -m jupyter nbconvert --to notebook --execute notebook.ipynb --output executed-notebook.ipynb --output-dir /tmp --ExecutePreprocessor.timeout=180
