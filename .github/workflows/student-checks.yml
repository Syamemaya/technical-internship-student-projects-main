name: student-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project environment
        run: uv sync --all-groups --locked --python 3.12

      - name: Validate student project contract
        run: uv run --locked python scripts/validate_projects.py

      - name: Validate dependency policy
        run: uv run --locked python scripts/validate_dependencies.py

      - name: Scan tracked files for secrets
        run: uv run --locked python scripts/security_scan.py

      - name: Validate documentation links and notebook IDs
        run: uv run --locked python scripts/validate_docs.py

      - name: Lint repository scripts
        run: uv run --locked ruff check scripts starter-projects templates/validate_submission.py

      - name: Run public tests
        run: uv run --locked python scripts/run_public_tests.py

      - name: Run A03 paper micro-packs
        run: uv run --locked python scripts/run_paper_packs.py

      - name: Execute student notebooks
        run: uv run --locked python scripts/run_notebooks.py
