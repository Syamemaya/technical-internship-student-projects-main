[project]
name = "technical-internship-platform"
version = "0.1.0"
description = "Reusable project, teaching, and acceptance infrastructure for technical internships."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.24,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.9,<1",
]
notebooks = [
  "ipykernel>=6.29,<7",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
]
ml = [
  "pandas>=2,<3",
  "scikit-learn>=1.3,<2",
]
dl = [
  "torch>=2.13,<2.14",
]

[tool.uv]
package = false
